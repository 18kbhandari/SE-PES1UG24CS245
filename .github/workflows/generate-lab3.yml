name: Generate Lab 3 submission files
on:
  push:
    paths:
      - 'Lab3_Component_Diagram.svg'
      - 'Lab3_Written_Justification.md'
      - 'generate_lab3.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate PDFs and PNG
        run: python generate_lab3.py
      - name: Commit generated submission files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Lab3_Component_Diagram_Kushagra_Bhandari_PES1UG24CS245.pdf Lab3_Component_Diagram_Kushagra_Bhandari_PES1UG24CS245.png Lab3_Written_Justification_Kushagra_Bhandari_PES1UG24CS245.pdf
          git diff --cached --quiet || git commit -m "Submit Lab 3 component modelling assignment"
          git push
