name: Generate Lab 3 submission files
on:
  push:
    paths:
      - 'Lab3/**'
      - '.github/workflows/generate-lab3.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install generation dependencies
        run: python -m pip install --upgrade pip cairosvg reportlab python-docx
      - name: Generate submission files
        run: python Lab3/generate_lab3.py
      - name: Commit generated submission files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Lab3/Lab3_Component_Diagram_Kushagra_Bhandari_PES1UG24CS245.pdf Lab3/Lab3_Component_Diagram_Kushagra_Bhandari_PES1UG24CS245.png Lab3/Lab3_Written_Justification_Kushagra_Bhandari_PES1UG24CS245.pdf Lab3/Lab3_Written_Justification_Kushagra_Bhandari_PES1UG24CS245.docx
          git diff --cached --quiet || git commit -m "Update Lab 3 final submission"
          git push
