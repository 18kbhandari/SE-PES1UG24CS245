<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".16"/></filter></defs><style>.title{font:700 30px Arial;fill:#172033}.subtitle{font:15px Arial;fill:#64748b}.layer{font:700 18px Arial}.st{font:13px Arial;fill:#334155}.small{font:12px Arial;fill:#475569}.ct{font:700 18px Arial;fill:#172033}.comp{font:12px Arial;fill:#64748b}.label{font:700 12px Arial;fill:#334155}</style><rect width="1600" height="1000" fill="#f8fafc"/><text x="800" y="48" text-anchor="middle" class="title">Self-Service Coffee Kiosk — UML Component Diagram</text><text x="800" y="75" text-anchor="middle" class="subtitle">Layered Architecture • 5 components • 4 required interfaces</text><rect x="45" y="105" width="1510" height="210" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/><rect x="45" y="340" width="1510" height="290" rx="18" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/><rect x="45" y="655" width="1510" height="210" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/><text x="75" y="138" class="layer" fill="#1d4ed8">PRESENTATION LAYER</text><text x="75" y="373" class="layer" fill="#6d28d9">BUSINESS LAYER</text><text x="75" y="688" class="layer" fill="#15803d">DATA / HARDWARE LAYER</text><g filter="url(#shadow)"><rect x="120" y="175" width="350" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><rect x="625" y="405" width="350" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><rect x="625" y="535" width="350" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><rect x="1115" y="700" width="350" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><rect x="1115" y="825" width="350" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/></g><g text-anchor="middle"><text x="295" y="210" class="comp">&lt;&lt;component&gt;&gt;</text><text x="295" y="245" class="ct">Touch Screen UI</text><text x="800" y="440" class="comp">&lt;&lt;component&gt;&gt;</text><text x="800" y="475" class="ct">Order Manager</text><text x="800" y="570" class="comp">&lt;&lt;component&gt;&gt;</text><text x="800" y="605" class="ct">Payment Service</text><text x="1290" y="735" class="comp">&lt;&lt;component&gt;&gt;</text><text x="1290" y="770" class="ct">Menu &amp; Pricing DB</text><text x="1290" y="860" class="comp">&lt;&lt;component&gt;&gt;</text><text x="1290" y="895" class="ct">Receipt Printer</text></g><g stroke="#475569" stroke-width="2.5" fill="none"><line x1="470" y1="225" x2="625" y2="455"/><line x1="800" y1="505" x2="800" y2="535"/><line x1="1115" y1="750" x2="975" y2="455"/><line x1="1115" y1="875" x2="975" y2="480"/></g><circle cx="470" cy="225" r="10" fill="white" stroke="#2563eb" stroke-width="2.5"/><path d="M625 445 A12 12 0 0 0 625 469" fill="none" stroke="#7c3aed" stroke-width="2.5"/><path d="M788 505 A12 12 0 0 0 812 505" fill="none" stroke="#7c3aed" stroke-width="2.5"/><circle cx="800" cy="535" r="10" fill="white" stroke="#7c3aed" stroke-width="2.5"/><circle cx="1115" cy="750" r="10" fill="white" stroke="#16a34a" stroke-width="2.5"/><path d="M975 443 A12 12 0 0 0 975 467" fill="none" stroke="#7c3aed" stroke-width="2.5"/><circle cx="1115" cy="875" r="10" fill="white" stroke="#16a34a" stroke-width="2.5"/><path d="M975 468 A12 12 0 0 0 975 492" fill="none" stroke="#7c3aed" stroke-width="2.5"/><text x="520" y="295" class="label" transform="rotate(34 520 295)">Order Interface</text><text x="520" y="313" class="small" transform="rotate(34 520 313)">(touch input / API)</text><text x="820" y="525" class="label">Payment Interface</text><text x="820" y="543" class="small">(API call)</text><text x="1030" y="600" class="label" transform="rotate(-64 1030 600)">Menu Interface</text><text x="1050" y="590" class="small" transform="rotate(-64 1050 590)">(database query)</text><text x="1045" y="735" class="label" transform="rotate(-72 1045 735)">Receipt Interface</text><text x="1063" y="730" class="small" transform="rotate(-72 1063 730)">(hardware / API)</text><rect x="80" y="885" width="1440" height="70" rx="12" fill="white" stroke="#cbd5e1"/><text x="105" y="913" class="st">Scenario: Espresso, Americano, Latte • Small/Large • Credit card only • Touchscreen • Receipt printing • Menu/pricing storage</text><text x="105" y="938" class="small">○ Ball = provided interface | Socket = required interface | Solid connector = component communication</text></svg>