<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".15"/></filter></defs>
<style>
.title{font:700 30px Arial;fill:#172033}.subtitle{font:15px Arial;fill:#64748b}.layer{font:700 18px Arial}.ct{font:700 18px Arial;fill:#172033}.comp{font:12px Arial;fill:#64748b}.body{font:14px Arial;fill:#334155}.label{font:700 13px Arial;fill:#172033}.small{font:12px Arial;fill:#475569}
</style>
<rect width="1600" height="1000" fill="#ffffff"/>
<text x="800" y="45" text-anchor="middle" class="title">Self-Service Coffee Kiosk — UML Component Diagram</text>
<text x="800" y="72" text-anchor="middle" class="subtitle">Layered Architecture • 5 components • 4 interfaces</text>

<rect x="35" y="100" width="1530" height="220" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
<rect x="35" y="340" width="1530" height="300" rx="18" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
<rect x="35" y="660" width="1530" height="190" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
<text x="60" y="135" class="layer" fill="#1d4ed8">PRESENTATION LAYER</text>
<text x="60" y="375" class="layer" fill="#6d28d9">BUSINESS LAYER</text>
<text x="60" y="695" class="layer" fill="#15803d">DATA / HARDWARE LAYER</text>

<g filter="url(#shadow)">
<rect x="110" y="155" width="360" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<rect x="590" y="405" width="420" height="145" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<rect x="550" y="690" width="360" height="120" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<rect x="1190" y="405" width="340" height="145" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<rect x="1190" y="690" width="340" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
</g>

<g text-anchor="middle">
<text x="290" y="188" class="comp">&lt;&lt;component&gt;&gt;</text><text x="290" y="220" class="ct">Touch Screen UI</text>
<text x="800" y="438" class="comp">&lt;&lt;component&gt;&gt;</text><text x="800" y="470" class="ct">Order Manager</text>
<text x="730" y="720" class="comp">&lt;&lt;component&gt;&gt;</text><text x="730" y="752" class="ct">Payment Service</text>
<text x="1360" y="438" class="comp">&lt;&lt;component&gt;&gt;</text><text x="1360" y="470" class="ct">Menu &amp; Pricing DB</text>
<text x="1360" y="720" class="comp">&lt;&lt;component&gt;&gt;</text><text x="1360" y="752" class="ct">Receipt Printer</text>
</g>

<g class="body">
<text x="140" y="250">Display menu • Capture user input • Show order status</text>
<text x="620" y="505">Process orders • Validate selections • Coordinate payment</text>
<text x="620" y="528">Send print requests • Access menu data</text>
<text x="1240" y="505">Store menu items • Store pricing • Provide menu data</text>
<text x="1240" y="528">Manage drink sizes</text>
<text x="580" y="785">Process credit card payments • Validate transactions • Return status</text>
<text x="1220" y="785">Receive print requests • Print order receipts • Return status</text>
</g>

<!-- Order interface: provided by UI, required by Order Manager -->
<path d="M470 215 H540 V385 H800" fill="none" stroke="#475569" stroke-width="2.5"/>
<circle cx="470" cy="215" r="11" fill="white" stroke="#2563eb" stroke-width="2.5"/>
<path d="M788 385 A12 12 0 0 0 812 385" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
<text x="505" y="200" class="label">Order Interface</text><text x="505" y="216" class="small">(UI Input API)</text>

<!-- Payment interface: required by Order Manager, provided by Payment Service -->
<path d="M800 550 V675 H730 V690" fill="none" stroke="#475569" stroke-width="2.5"/>
<path d="M788 550 A12 12 0 0 0 812 550" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
<circle cx="730" cy="690" r="11" fill="white" stroke="#7c3aed" stroke-width="2.5"/>
<text x="825" y="585" class="label">Payment Interface</text><text x="825" y="601" class="small">(Payment API)</text>

<!-- Menu interface: required by Order Manager, provided by DB -->
<path d="M1010 475 H1190" fill="none" stroke="#475569" stroke-width="2.5"/>
<path d="M998 463 A12 12 0 0 0 998 487" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
<circle cx="1190" cy="475" r="11" fill="white" stroke="#16a34a" stroke-width="2.5"/>
<text x="1050" y="455" class="label">Menu Interface</text><text x="1050" y="472" class="small">(Database API)</text>

<!-- Receipt interface: required by Order Manager, provided by printer -->
<path d="M910 520 H1080 V750 H1190" fill="none" stroke="#475569" stroke-width="2.5"/>
<path d="M898 508 A12 12 0 0 0 898 532" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
<circle cx="1190" cy="750" r="11" fill="white" stroke="#16a34a" stroke-width="2.5"/>
<text x="1010" y="720" class="label">Receipt Interface</text><text x="1010" y="737" class="small">(Printer API)</text>

<rect x="55" y="875" width="1490" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="80" y="902" class="label">Legend:</text>
<circle cx="165" cy="928" r="10" fill="white" stroke="#2563eb" stroke-width="2.5"/><text x="185" y="933" class="small">Ball = provided interface</text>
<path d="M380 916 A12 12 0 0 0 380 940" fill="none" stroke="#7c3aed" stroke-width="2.5"/><text x="400" y="933" class="small">Socket = required interface</text>
<line x1="625" y1="928" x2="695" y2="928" stroke="#475569" stroke-width="2.5"/><text x="710" y="933" class="small">Solid line = component communication</text>
<text x="1000" y="902" class="label">Scenario:</text>
<text x="1090" y="902" class="small">Espresso, Americano, Latte • Small / Large • Credit card only</text>
<text x="1090" y="925" class="small">Touchscreen interface • Receipt printing • Menu/pricing storage</text>
</svg>